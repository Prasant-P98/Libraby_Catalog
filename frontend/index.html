<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Catalog System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="brand">
            <span class="logo-icon">📚</span>
            <h1>Library Catalog System</h1>
        </div>
        <div class="stats-bar">
            <div class="stat-pill"><span id="total-count">0</span> Total</div>
            <div class="stat-pill avail"><span id="avail-count">0</span> Available</div>
            <div class="stat-pill borrowed"><span id="borrowed-count">0</span> Checked Out</div>
        </div>
    </header>

    <main class="container">
        <section class="card form-card">
            <h2>➕ Add New Book</h2>
            <form id="add-book-form">
                <div class="form-group">
                    <label>Book Category</label>
                    <select id="book-type" required>
                        <option value="Fiction">Fiction</option>
                        <option value="NonFiction">Non-Fiction</option>
                        <option value="Reference">Reference</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="book-title" placeholder="e.g., Clean Code" required>
                </div>

                <div class="form-group">
                    <label>Author</label>
                    <input type="text" id="book-author" placeholder="e.g., Robert C. Martin" required>
                </div>

                <div class="form-group" id="dynamic-field-group">
                    <label id="dynamic-label">Sub-Genre</label>
                    <input type="text" id="dynamic-val" placeholder="e.g., Technology" required>
                </div>

                <button type="submit" class="btn btn-primary">Add Book to Catalog</button>
            </form>
        </section>

        <section class="catalog-section">
            <div class="toolbar">
                <input type="text" id="search-input" placeholder="🔍 Search title or author...">
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="available">Available</button>
                    <button class="filter-btn" data-filter="borrowed">Checked Out</button>
                </div>
            </div>

            <div id="catalog-grid" class="grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
